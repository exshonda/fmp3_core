/*
 *		プロセッサ間割込みのコンフィギュレーションファイル
 *		（ARM Musca-B1 / SSE-200 用）
 *
 *  各コア宛ての MHU0 割込み（NVIC IRQ6）を，自コアのクラスに登録する．
 *  受信ハンドラ _kernel_ipi_irq_handler は両コア共通で，自コア番号
 *  （get_my_prcidx）に応じて参照する MHU レジスタを切り替える．
 */

#include "target_ipi.h"

#if TNUM_PRCID > 1

/*
 *  初期化ルーチンの登録
 */
CLASS(CLS_PRC1) {
	ATT_INI({ TA_NULL, 1, target_ipi_initialize });
}

CLASS(CLS_PRC2) {
	ATT_INI({ TA_NULL, 2, target_ipi_initialize });
}

/*
 *  プロセッサ間割込みサービスルーチン（割込みハンドラ）の登録
 */
CLASS(CLS_PRC1) {
	CFG_INT(INTNO_IPI_PRC1, { TA_ENAINT, INTPRI_IPI });
	DEF_INH(INHNO_IPI_PRC1, { TA_NULL, _kernel_ipi_irq_handler });
}

CLASS(CLS_PRC2) {
	CFG_INT(INTNO_IPI_PRC2, { TA_ENAINT, INTPRI_IPI });
	DEF_INH(INHNO_IPI_PRC2, { TA_NULL, _kernel_ipi_irq_handler });
}

#endif /* TNUM_PRCID > 1 */
