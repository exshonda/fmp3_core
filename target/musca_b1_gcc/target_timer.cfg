/*
 *  タイマドライバのコンフィギュレーションファイル（ARM Musca-B1 用）
 *
 *  イベント駆動 HRT（SysTick）を用いる．FMP3 では割込みをプロセッサ単位の
 *  クラスに割り付ける．本ターゲットは単一プロセッサ（PRC1）．クラス内では
 *  生の割込み番号でプロセッサ依存の割込みを指定できる．
 */
#include "target_timer.h"

CLASS(CLS_PRC1) {
	ATT_INI({ TA_NULL, 0, _kernel_target_hrt_initialize });
	ATT_TER({ TA_NULL, 0, _kernel_target_hrt_terminate });
	CFG_INT(INTNO_TIMER_PRC1, { TA_ENAINT|INTATR_TIMER, INTPRI_TIMER });
	DEF_INH(INHNO_TIMER_PRC1, { TA_NULL, target_hrt_handler });
}
