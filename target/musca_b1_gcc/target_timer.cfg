/*
 *  タイマドライバのコンフィギュレーションファイル（ARM Musca-B1 用）
 *
 *  イベント駆動 HRT（SysTick）を用いる．FMP3 では割込みをプロセッサ単位の
 *  クラスに割り付ける．本ターゲットは単一プロセッサ（PRC1）．クラス内では
 *  生の割込み番号でプロセッサ依存の割込みを指定できる．
 */
#include "target_timer.h"

CLASS(CLS_PRC1) {
	ATT_INI({ TA_NULL, 0, _kernel_target_hrt_initialize });
	ATT_TER({ TA_NULL, 0, _kernel_target_hrt_terminate });
	CFG_INT(INTNO_TIMER_PRC1, { TA_ENAINT|INTATR_TIMER, INTPRI_TIMER });
	DEF_INH(INHNO_TIMER_PRC1, { TA_NULL, target_hrt_handler });
}

/*
 *  PRC2 でも SysTick を HRT として使用する．
 *
 *  TOPPERS_TEPP_PRC は 2 コア構成で 0x3（PRC1 と PRC2 の両方が時間イベント処理
 *  プロセッサ）となるため，カーネルは PRC2 に対しても target_hrt_set_event() を
 *  呼ぶ．これは PRC2 の SysTick を SYSTIC_TICINT 付きで起動するので，PRC2 側にも
 *  初期化ルーチンと割込みハンドラを登録しなければ，SysTick 割込みの発生時に
 *  ハンドラ未登録の例外となる．
 */
#if TNUM_PRCID >= 2
CLASS(CLS_PRC2) {
	ATT_INI({ TA_NULL, 0, _kernel_target_hrt_initialize });
	ATT_TER({ TA_NULL, 0, _kernel_target_hrt_terminate });
	CFG_INT(INTNO_TIMER_PRC2, { TA_ENAINT|INTATR_TIMER, INTPRI_TIMER });
	DEF_INH(INHNO_TIMER_PRC2, { TA_NULL, target_hrt_handler });
}
#endif /* TNUM_PRCID >= 2 */
