/*
 *		割込み管理機能のテスト(2)のシステムコンフィギュレーションファイル
 *
 *  $Id$
 */
INCLUDE("test_common1.cfg");

#include "test_int2.h"

CLASS(CLS_PRC1) {
	CRE_TSK(TASK1, { TA_ACT, 1, task1, MID_PRIORITY, STACK_SIZE, NULL });
	CFG_INT(INTNO1, { INTNO1_INTATR, INTNO1_INTPRI });

	/*
	 *  同一の割込み番号に3本の割込みサービスルーチンを登録する．
	 *
	 *  コンフィギュレータは，同一の割込み番号に登録された割込みサービ
	 *  スルーチンを，isrpriの昇順に，isrpriが同じ場合はシステムコンフィ
	 *  ギュレーションファイル中の静的APIの順序で呼び出す
	 *  （doc/configurator.txt 4.7.1.2）．そこで，このテストでは，静的
	 *  APIの記述順とisrpri順とを意図的に食い違わせている．
	 *
	 *  ISRIDの名前は「呼び出される順序」を表し，記述順とも辞書順とも一
	 *  致しない．これは，呼出し順序がISRIDの辞書順に依存していないこと
	 *  を検出できるようにするためである．
	 */
	CRE_ISR(INTNO1_ISR_LAST, { TA_NULL, 3, INTNO1, isr3, 2 });
	CRE_ISR(INTNO1_ISR_FIRST, { TA_NULL, 1, INTNO1, isr1, 1 });
	CRE_ISR(INTNO1_ISR_SECOND, { TA_NULL, 2, INTNO1, isr2, 1 });
}
