/*
 *  修正3（kernel/interrupt.py:340-341、旧行番号323-324）の最小再現。
 *
 *  CRE_ISR の intno が INTNO_CREISR_VALID の範囲外（polarfireのPLICには
 *  存在しない 99999）の場合、E_PAR（interrupt.py:328-329相当）が出た
 *  「後」も、
 *      for prcid in clsData[params["class"]]["affinityPrcList"]:
 *          inhnoVal = toInhnoVal[prcid][params["intno"].val]   # 修正前
 *  は continue せず無条件に実行される（この上のE_PARチェックは
 *  error_illegal()を呼ぶだけで処理を止めない）。修正前は
 *  toInhnoVal[prcid] に intno=99999 というキーが無いため Python は
 *  KeyError で異常終了し、以降に出るはずの診断（例えばintnoに対する
 *  CFG_INT未設定のE_OBJ）が失われていた。
 *
 *  Ruby版（interrupt.trb:376） $toInhnoVal[prcid][params[:intno].val] は
 *  Hashの欠損キー参照でnilを返し、続くhas_key?(nil)が偽になって素通り
 *  する（例外にならない）。修正3はPython側を
 *  toInhnoVal[prcid].get(params["intno"].val) にしてこれと同じ意味に
 *  揃えた（None は cfgData["DEF_INH"] のキーになり得ないため
 *  `None in cfgData["DEF_INH"]` は必ず偽で、Rubyのhas_key?(nil)と同義）。
 *
 *  ★target_kernel.cfg はここでINCLUDEしない: run.sh が差し替えるpass1の
 *  CONFIG-FILE引数列は「target_kernel.cfg <this file>」の順に既に
 *  target_kernel.cfg を渡している（他の.cfgと同じ理由。二重INCLUDEすると
 *  target_kernel.cfg中のCFG_INT等が「重複」エラーになり本来見たい
 *  E_PARの検証が汚染される）。
 */
CLASS(CLS_PRC1) {
	CRE_ISR(ISR_KEYERROR, { TA_NULL, 0, 99999, dummy_isr, 1 });
};
