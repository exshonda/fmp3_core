/*
 *  E_RSATR (interrupt.py 編集2 / kernel/interrupt.py:245-249) の最小再現。
 *  DEF_INHのinhnoに対応するプロセッサ(prc2)が、対応するintnoに割り付けた
 *  CFG_INTのクラス(CLS_PRC1, affinityPrcList=[1])の割付け可能プロセッサに
 *  含まれない場合にエラーとなることを確認する。
 *
 *  ★target_kernel.cfg はここでINCLUDEしない: run.sh が差し替えるpass1の
 *  CONFIG-FILE引数列は「target_kernel.cfg <this file>」の順に既に
 *  target_kernel.cfg を渡している（実ビルドのpass1コマンドがそうなって
 *  いるため）。ここでもう一度INCLUDEすると、target_kernel.cfgが二重に
 *  処理され、その中のCFG_INT/DEF_INHが「重複」エラー（E_OBJ）になり、
 *  本来見たいE_RSATRの検証が汚染される（musca_b1で実際に踏んで判明した）。
 */
CLASS(CLS_PRC1) {
	CFG_INT(31, { TA_ENAINT | TA_EDGE, -2 });
};
CLASS(CLS_PRC2) {
	DEF_INH((2 << 16) | 31, { TA_NULL, dummy_inthdr });
};
