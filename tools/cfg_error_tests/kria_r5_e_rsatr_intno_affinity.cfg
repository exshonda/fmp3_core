/*
 *  E_RSATR (kernel/interrupt.py:145-157) の最小再現。kria_r5 版。
 *
 *  polarfire（PLIC）ではINTNO_VALID[prcid]が全プロセッサで同一集合
 *  （plic_intno_list、prcidによる符号化なし）のため、この分岐は構造的に
 *  発火しない（実測で確認済み。musca_b1/rp2350と同じ事情）。
 *
 *  kria_r5（GIC、arch/arm_gcc/zynqmp_r5/chip_kernel.py:15-31）は，
 *  「プライベート」割込み番号（0〜31）だけをプロセッサ番号で符号化する
 *  （INTNO_VALID[prcid] に (prcid << 16) | intno を追加。intno 32〜186は
 *  「グローバル」割込みでプロセッサ符号化なし）。汎用の
 *  tools/cfg_error_tests/e_rsatr_inhno_affinity.cfg（bare intno=31、
 *  プロセッサ符号化なしのpolarfire/PLIC前提）はそのままでは通らない
 *  （実測：Task 11で確認済み。bare intnoはINTNO_VALIDに存在せず
 *  E_PAR「illegal intno」に化ける。musca_b1/rp2350が既に踏んでいた
 *  事情と同じ）。
 *
 *  intno 0〜3（プロセッサごとのIPI dispatch/ext_ker/set_hrt_evt/
 *  start_scycが使用．arch/arm_gcc/common/gic_ipi.h:52-93）は既に
 *  target_kernel.cfg 経由でCFG_INT済みのため使えない。未使用の
 *  プライベート範囲intno=20を使う。
 *
 *  CLS_PRC1（割付け可能：PRC1のみ、target_class.py）の囲みの中で、
 *  PRC2用に符号化されたintno（(2<<16)|20）を指定すると、「クラスの
 *  割付け可能プロセッサ(PRC1)」と「intnoが符号化するプロセッサ(PRC2)」
 *  が食い違い、E_RSATRとなる。TNUM_PRCID>=2（kria_r5-2core）でのみ
 *  意味を持つ（1コアではINTNO_VALID[2]自体が存在せずE_PARになる。
 *  target_class.py はTNUM_PRCID==1のときCLS_PRC1のみを定義しCLS_PRC2は
 *  存在しない）。
 *
 *  ★target_kernel.cfg はここでINCLUDEしない: run.sh が差し替えるpass1の
 *  CONFIG-FILE引数列は「target_kernel.cfg <this file>」の順に既に
 *  target_kernel.cfg を渡している。ここでもう一度INCLUDEするとその中の
 *  CFG_INT（IPI・タイマ等）が二重に処理され「重複」エラー（E_OBJ）になり、
 *  本来見たいE_RSATRの検証が汚染される（musca_b1/rp2350版と同じ理由）。
 */
CLASS(CLS_PRC1) {
	CFG_INT((2 << 16) | 20, { TA_ENAINT | TA_EDGE, -2 });
};
