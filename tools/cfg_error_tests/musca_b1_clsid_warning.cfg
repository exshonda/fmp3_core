/*
 *  target_class.py の clsid 盲点（Task 8 申し送り）を埋めるための最小構成。
 *
 *  ★盲点の実測結果:
 *  - clsData[cls]['clsid'] は arch/riscv_gcc/common/core_kernel.py の
 *    SecnameKernelData()/SecnameStack() 経由で polarfire の kernel_cfg.c に
 *    セクション名（".kernel_data_CLS_PRC1" 等）として直接現れるため、
 *    tools/cfg_equivalence.sh の通常の diff で既に検証されている
 *    （実測: build/polarfire_soc_kit-qemu/generated/kernel_cfg.c に
 *    ".kernel_data_CLS_PRC1" 等が literal に出力されることを確認済み）。
 *  - 一方 arch/arm_m_gcc/common/core_kernel.py の同名関数は常に "" を返す
 *    （musca_b1 は生成物にセクション名を出さない設計）ため、musca_b1 では
 *    clsid が生成物に一切現れず、cfg_equivalence.sh の対象外のまま
 *    （Task 8 が報告した盲点は musca_b1 に限って実在する）。
 *  - musca_b1 で clsid が唯一露出するのは kernel/interrupt.py:139/293 の
 *    warning_api()（OMIT_MULTIPRC_INTERRUPT時のみ発火）。この定数は
 *    kernel/kernel_sym.def 経由で `defined(OMIT_MULTIPRC_INTERRUPT)` を
 *    実コンパイルして判定される（他のTARGET_INTATR等と同じ仕組み）ため、
 *    run.sh の第4引数（追加コンパイルフラグ）で -DOMIT_MULTIPRC_INTERRUPT
 *    を渡すことで発火させられる。
 *
 *  CLS_ALL_PRC2（割付け可能：全プロセッサ、初期割付け：PRC2）の囲みの中に
 *  PRC2専用に符号化したintnoでCFG_INTを1つ書く。OMIT_MULTIPRC_INTERRUPT
 *  下では affinityPrcBitmap(全プロセッサ) != initPrcBitmap(PRC2のみ) と
 *  なるため warning が発火し、"CLS_ALL_PRC2" という文字列（clsidの
 *  NumStrの文字列表現）がメッセージに現れる。
 *  （intnoがCLS_ALL_PRC2のaffinityPrcList=[1,2]全部には収まらないため、
 *  E_RSATR（本ファイル別置きのmusca_b1_e_rsatr_intno_affinity.cfgと同種）
 *  も併発するが、目的はwarning文言中のclsid比較なので許容する。）
 */
CLASS(CLS_ALL_PRC2) {
	CFG_INT((2 << 16) | 76, { TA_ENAINT | TA_EDGE, -2 });
};
