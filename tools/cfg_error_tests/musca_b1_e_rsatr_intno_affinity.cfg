/*
 *  E_RSATR (kernel/interrupt.py:145-157) の最小再現。musca_b1 版。
 *
 *  polarfire（PLIC）ではINTNO_VALID[prcid]が全プロセッサで同一集合
 *  （plic_intno_list、prcidによる符号化なし）のため、この分岐は構造的に
 *  発火しない（実測で確認済み）。musca_b1（NVIC）はtarget_kernel.py:17-24
 *  で INTNO_VALID[prcid] = [(prcid<<16)|intno for intno in 15..TMAX_INTNO]
 *  とプロセッサ番号を符号化しているため、この分岐が意味を持つ。
 *
 *  CLS_PRC1（割付け可能：PRC1のみ）の囲みの中で、PRC2用に符号化された
 *  intno（(2<<16)|76、target_test.hのINTNO2と同じ値）を指定すると、
 *  「クラスの割付け可能プロセッサ(PRC1)」と「intnoが符号化するプロセッサ
 *  (PRC2)」が食い違い、E_RSATRとなる。TNUM_PRCID>=2（musca_b1-2core）
 *  でのみ意味を持つ（1コアではINTNO_VALID[2]自体が存在せずE_PARになる）。
 *
 *  ★target_kernel.cfg はここでINCLUDEしない: run.sh が差し替えるpass1の
 *  CONFIG-FILE引数列は「target_kernel.cfg <this file>」の順に既に
 *  target_kernel.cfg を渡している。ここでもう一度INCLUDEするとその中の
 *  CFG_INT（タイマ等）が二重に処理され「重複」エラー（E_OBJ）になり、
 *  本来見たいE_RSATRの検証が汚染される（実際に踏んで判明した）。
 */
CLASS(CLS_PRC1) {
	CFG_INT((2 << 16) | 76, { TA_ENAINT | TA_EDGE, -2 });
};
