/*
 *  E_RSATR (kernel/interrupt.py:145-157) の最小再現。rp2350_pico2 版。
 *
 *  target_kernel.py（musca_b1 と共通．target/rp2350_pico2_gcc/target_kernel.py
 *  17-24 行）は INTNO_VALID[prcid] = [(prcid<<16)|intno for intno in
 *  15..TMAX_INTNO] とプロセッサ番号を符号化しているため，汎用の
 *  tools/cfg_error_tests/e_rsatr_inhno_affinity.cfg（bare intno=31，
 *  プロセッサ符号化なしの polarfire/PLIC 前提）はそのままでは通らない
 *  （実測：bare intno は INTNO_VALID に存在せず E_PAR "illegal intno" に
 *  化ける。これは musca_b1_e_rsatr_intno_affinity.cfg が既に踏んでいた
 *  事情と同じ）。
 *
 *  CLS_PRC1（割付け可能：PRC1のみ）の囲みの中で，PRC2用に符号化された
 *  intno（(2<<16)|19，target_test.hのINTNO2=((0x00020000U|RP2350_TIMER0_3_IRQn)+16)
 *  = (2<<16)|(3+16) = (2<<16)|19 と同じ値）を指定すると，「クラスの割付け
 *  可能プロセッサ(PRC1)」と「intnoが符号化するプロセッサ(PRC2)」が食い違い，
 *  E_RSATRとなる。TNUM_PRCID>=2（-DFMP3_PRC_NUM=2）でのみ意味を持つ
 *  （1コアではINTNO_VALID[2]自体が存在せずE_PARになる）。
 *
 *  ★target_kernel.cfg はここでINCLUDEしない: run.sh が差し替えるpass1の
 *  CONFIG-FILE引数列は「target_kernel.cfg <this file>」の順に既に
 *  target_kernel.cfg を渡している（musca_b1版と同じ理由。二重INCLUDEすると
 *  target_kernel.cfg中のCFG_INT等が「重複」エラー（E_OBJ）になり本来見たい
 *  E_RSATRの検証が汚染される）。
 */
CLASS(CLS_PRC1) {
	CFG_INT((2 << 16) | 19, { TA_ENAINT | TA_EDGE, -2 });
};
